[project]
name = "zerodefect"
version = "0.1.0"
description = "AI visual defect detection and quality intelligence for automobile polymer parts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pillow>=10.3",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspection", "ml", "simulator"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
