[project]
name = "zerodefect"
version = "0.1.0"
description = "AI visual defect detection and quality intelligence for automobile polymer parts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.142.1",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.2",
    "pillow>=10.3",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.13",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.66",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
    "ruff>=0.6",
]
# Defect detector training (M2): uv sync --group train. Ultralytics is AGPL-3.0 (academic use).
train = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxslim>=0.1.82",
    "ultralytics>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "inspection", "ml", "simulator"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Ultralytics asks for the GUI build of OpenCV; the headless build (already a dependency) provides
# the same cv2 module, and installing both breaks it. A marker that never matches drops the GUI build.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# CPU-only PyTorch on Linux (the default Linux wheels pull ~2 GB of CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
