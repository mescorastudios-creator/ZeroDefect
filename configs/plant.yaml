# Simulated injection-moulding plant.
#
# Public datasets carry no production metadata, so this simulator creates it:
# every inspected part gets a machine, mould cavity, operator, shift, resin lot,
# supplier and process parameters, and is bound to a real dataset image of the
# matching defect class. THE METADATA IS SIMULATED; the images are real.
#
# Planted faults (see `faults`) are the ground truth for evaluating root-cause
# analysis. All times are in days from the simulation start.

seed: 7
start: 2026-09-01T06:00:00
days: 14

shifts:
  day_start: "06:00"
  names: [A, B, C]            # 06-14, 14-22, 22-06

# One operator per line and shift. Teams rotate through the shifts weekly and
# operators rotate between lines daily, so operator, line and shift effects are
# separable.
teams:
  T1: [OP-01, OP-02, OP-03]
  T2: [OP-04, OP-05, OP-06]
  T3: [OP-07, OP-08, OP-09]

resin_change_hours: 8         # a machine switches resin supply (supplier) at this interval

suppliers:
  - {id: SUP-A, name: Polymerwerk Nord, lot_days: 2}
  - {id: SUP-B, name: Resinova, lot_days: 3}
  - {id: SUP-C, name: Kunststoff Handel Ost, lot_days: 2}
  # Wetter resin on arrival: more voids and sink marks (via the moisture effect).
  - {id: SUP-D, name: PlastiSource Asia, lot_days: 4, moisture: 1.6}

lines:
  - id: L1
    name: Line 1
    machines:
      - id: IMM-01
        part_type: plastic_nut
        material: PA66
        mould: MLD-101
        resin_mix: {SUP-A: 0.6, SUP-C: 0.4}
        process: {melt_temp: 285, injection_pressure: 850, holding_time: 5.0, cooling_time: 12, mould_temp: 80, cycle_time: 28}
      - id: IMM-02
        part_type: plastic_plug
        material: PP
        mould: MLD-102
        resin_mix: {SUP-B: 0.7, SUP-D: 0.3}
        process: {melt_temp: 230, injection_pressure: 700, holding_time: 4.0, cooling_time: 15, mould_temp: 40, cycle_time: 30}
  - id: L2
    name: Line 2
    machines:
      - id: IMM-03
        part_type: end_cap
        material: ABS
        mould: MLD-201
        resin_mix: {SUP-A: 0.5, SUP-B: 0.5}
        process: {melt_temp: 240, injection_pressure: 900, holding_time: 6.0, cooling_time: 14, mould_temp: 60, cycle_time: 32}
      - id: IMM-04
        part_type: u_block
        material: POM
        mould: MLD-202
        resin_mix: {SUP-C: 0.6, SUP-D: 0.4}
        process: {melt_temp: 205, injection_pressure: 1000, holding_time: 7.0, cooling_time: 16, mould_temp: 90, cycle_time: 36}
  - id: L3
    name: Line 3
    machines:
      - id: IMM-05
        part_type: mounts
        material: PA6-GF30
        mould: MLD-301
        resin_mix: {SUP-B: 0.5, SUP-C: 0.5}
        process: {melt_temp: 275, injection_pressure: 1100, holding_time: 6.5, cooling_time: 18, mould_temp: 85, cycle_time: 38}
      - id: IMM-06
        part_type: plastic_nut
        material: PA66
        mould: MLD-302
        resin_mix: {SUP-A: 0.4, SUP-C: 0.6}
        process: {melt_temp: 285, injection_pressure: 850, holding_time: 5.0, cooling_time: 12, mould_temp: 80, cycle_time: 28}

# Per-shot variation: white noise `sd` plus a slow AR(1) wander with
# stationary deviation `drift_sd` and time constant `drift_hours`.
# `tolerance` is the deviation that counts as one unit in the defect model.
process_params:
  melt_temp:          {unit: "°C",  sd: 1.5,  drift_sd: 1.5,  drift_hours: 3, tolerance: 10}
  injection_pressure: {unit: bar,   sd: 10,   drift_sd: 10,   drift_hours: 3, tolerance: 60}
  holding_time:       {unit: s,     sd: 0.05, drift_sd: 0.05, drift_hours: 3, tolerance: 0.6}
  cooling_time:       {unit: s,     sd: 0.1,  drift_sd: 0.1,  drift_hours: 3, tolerance: 1.5}
  mould_temp:         {unit: "°C",  sd: 0.8,  drift_sd: 1.0,  drift_hours: 3, tolerance: 8}
  cycle_time:         {unit: s,     sd: 0.2,  drift_sd: 0.15, drift_hours: 3, tolerance: 2}

# Defect probability per part and class:
#   base_rate * exp(sum(process coef * deviation / tolerance)) * lot_factor ** resin exponent * fault multipliers
# The coefficients encode injection-moulding domain knowledge.
defect_model:
  base_rate:
    scratch: 0.006
    crack: 0.0015
    deformation: 0.003
    pit_void: 0.004
    missing_material: 0.003
    contamination: 0.004
    discoloration: 0.002
    unknown: 0.0
  process:
    missing_material: {melt_temp: -1.2, injection_pressure: -1.5, mould_temp: -1.3}  # short shot: cold or under-pressure fill
    pit_void: {holding_time: -1.5, cooling_time: -0.8, melt_temp: 0.6}               # sink/void: poor packing
    deformation: {cooling_time: -1.4, mould_temp: 0.8}                                # warpage: ejected too hot
    discoloration: {melt_temp: 1.5, cycle_time: 0.8}                                  # burn: overheating, long residence
    crack: {mould_temp: -0.9, injection_pressure: 0.7}                                # stress cracking
  resin:
    contamination: {contamination: 1.0}
    pit_void: {moisture: 1.0}
    discoloration: {moisture: 0.5}
  lot_sd: 0.15                # lot-to-lot spread (lognormal sigma) of resin moisture and contamination

stoppages:
  per_day: 1.2                # unplanned stops per machine and day
  mean_minutes: 20

faults:
  - id: F1
    kind: drift
    description: Failing heater band on IMM-03 lets the mould temperature drift down; short shots rise until maintenance.
    machine: IMM-03
    parameter: mould_temp
    per_day: -2.5
    from_day: 3.4
    to_day: 8.6
    maintenance_hours: 3
    expected_root_cause: {factor: machine, value: IMM-03, parameter: mould_temp, defect: missing_material}
  - id: F2
    kind: multiplier
    description: Resin lot SUP-C-L005 is contaminated with foreign particles; every machine running it is affected.
    lot: SUP-C-L005
    classes: {contamination: 8.0}
    expected_root_cause: {factor: resin_lot, value: SUP-C-L005, defect: contamination}
  - id: F3
    kind: multiplier
    description: Cavity 2 of mould MLD-301 on IMM-05 is worn from day 6; parts drag on ejection.
    machine: IMM-05
    cavity: 2
    from_day: 6
    classes: {deformation: 3.5, scratch: 1.8}
    expected_root_cause: {factor: cavity, value: IMM-05/2, defect: deformation}
  - id: F4
    kind: multiplier
    description: Operator OP-08 handles parts roughly when degating and packing.
    operator: OP-08
    classes: {scratch: 2.2}
    expected_root_cause: {factor: operator, value: OP-08, defect: scratch}
